[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-science"
version = "0.4.0"
description = "An agent harness and benchmark for biological and pharmaceutical simulation tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Claude Science" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rdkit>=2023.9",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
claude-science = "claude_science.cli:main"
claude-science-console = "claude_science.console:main"
claude-science-admin = "claude_science.admin:main"
claude-science-mcp = "claude_science.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_science*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
