[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "habscan"
version = "0.1.0"
description = "Probabilistic search for potentially habitable exoplanets: physics-based Monte Carlo habitability + ML candidate vetting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
habscan = "habscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
